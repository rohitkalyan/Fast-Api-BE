apiVersion: apps/v1
kind: Deployment
metadata:
  name: fast-api-be
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fast-api-be
  template:
    metadata:
      labels:
        app: fast-api-be
    spec:
      containers:
        - name: fast-api-be
          image: ghcr.io/rohitkalyan/fast-api-be:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000